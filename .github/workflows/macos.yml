name: MacRDP

on:
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Info
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Hardware ==="
          system_profiler SPHardwareDataType | head -n 25

          echo "=== User ==="
          whoami

          echo "=== Hostname ==="
          hostname

          echo "=== Display ==="
          system_profiler SPDisplaysDataType | head -n 40

      - name: Start AnyDesk
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          chmod +x mac/start-anydesk.sh
          bash mac/start-anydesk.sh

      - name: Show AnyDesk Details
        run: |
          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "======================================"
          echo "          ANYDESK CONNECTION"
          echo "======================================"

          echo "AnyDesk ID:"
          "$ANYDESK" --get-id || true

          echo
          echo "Status:"
          "$ANYDESK" --get-status || true

          echo
          echo "Keep this workflow running."
          echo "======================================"

      - name: Keep Runner Alive
        run: |
          echo "AnyDesk is running."
          echo "Waiting for remote connection..."

          while true; do
            echo "[$(date)] Runner alive"
            sleep 60
          done
